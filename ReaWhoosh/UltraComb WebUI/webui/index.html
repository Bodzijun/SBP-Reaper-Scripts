<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SBP ULTRACOMB 3 / Patch Console</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand" aria-label="SBP UltraComb 3"><span class="brand-prefix">SBP</span> <span class="brand-ultra">ULTRA</span><span class="brand-comb">COMB</span> <span class="brand-version">3</span></div><div id="globals"></div></header>
<nav aria-label="Signal route"><div id="route"></div></nav>
<main>
  <section id="modulation" class="work-panel"><div class="panel-title"><h1>MOD</h1><div id="mod-types" class="segments"></div></div><select id="mod-source" aria-label="Modulation source" hidden></select><div class="graph-heading"><span id="mod-graph-label">WAVEFORM / MODEL</span><span id="mod-live">NO DSP DATA</span></div><canvas id="mod-graph" aria-label="Modulation waveform and live DSP position"></canvas><div id="mod-controls" class="mod-controls"></div><button id="open-matrix" type="button">MATRIX ↗</button></section>
  <section id="core" class="work-panel"><div class="panel-title"><h1>CORE</h1><div id="core-tabs" class="segments"></div></div><div class="graph-heading"><span id="core-graph-label">SECTION CENTERS / MODEL</span><span id="core-summary"></span></div><canvas id="core-graph" aria-label="Core parameter model"></canvas><div id="core-controls" class="faders"></div><div id="core-secondary" class="secondary"></div><div id="core-mix" class="compact-grid"></div><div class="feedback core-feedback"><label>FEEDBACK <input id="feedback" type="range" min="0" max="1" step="0.001" disabled><output id="feedback-value">0.30</output></label><label>CAPTURE <select id="capture" disabled></select></label></div></section>
  <section id="module" class="work-panel"><div class="panel-title"><h1 id="module-name">FILTER</h1><div id="module-enable"></div></div><div class="graph-heading"><span id="module-graph-label">RESPONSE / MODEL</span><span id="module-summary"></span></div><canvas id="module-graph" aria-label="Module parameter model"></canvas><div id="module-controls" class="faders"></div><div id="module-secondary" class="secondary"></div></section>
</main>
<footer>
  <section class="analysis"><div class="analysis-title"><h2>IN / SPECTROGRAM</h2><span id="input-status">NO STREAM</span></div><canvas id="input-spectrogram" aria-label="Live input spectrogram"></canvas><div class="axis"><span>20 Hz → 20 kHz ↑</span><span>TIME →</span></div></section>
  <section id="utility"><div id="utility-tabs" class="segments"></div><div id="utility-controls"></div><div class="analysis-settings"><label>HISTORY <select id="history"><option value="4">4 s</option><option value="8" selected>8 s</option><option value="16">16 s</option></select></label><button id="freeze-display" type="button" title="Pause spectrogram display only">Ⅱ</button><button id="clear-display" type="button" title="Clear spectrogram history">↺</button><select id="palette" aria-label="Spectrogram color map" title="Spectrogram color map"><option value="aurora">Aurora</option><option value="ember">Ember</option><option value="ice">Ice</option><option value="mono">Mono</option></select><span class="scale"><i id="palette-scale"></i> −90…0 dB</span></div></section>
  <section class="analysis"><div class="analysis-title"><h2>OUT / SPECTROGRAM</h2><span id="output-status">NO STREAM</span></div><canvas id="output-spectrogram" aria-label="Live output spectrogram"></canvas><div class="axis"><span>20 Hz → 20 kHz ↑</span><span>TIME →</span></div></section>
</footer>
<div class="statusbar"><span id="status">Native parameters preserved · 3.0.0</span><button id="all-parameters" type="button" title="Search all native audio parameters">ALL PARAMETERS</button><output id="connection" title="Native DSP telemetry connection" aria-live="polite">CONNECTING</output></div>
<dialog id="parameter-dialog"><div class="dialog-title"><h2>PARAMETERS</h2><button id="close-dialog" type="button" title="Close">×</button></div><input id="search" type="search" placeholder="Filter by name or parameter number" aria-label="Search parameters"><div id="parameter-list"></div></dialog>
<dialog id="matrix-dialog"><div class="dialog-title"><h2>MODULATION MATRIX</h2><button id="close-matrix" type="button" title="Close matrix">×</button></div><div id="matrix-mode"></div><div id="mod-assignments"></div></dialog>
<script type="module" src="app.mjs"></script>
</body></html>
